name: Polyup
description: >-
  Let'sMOD (formerly Polyup) is a Sunnyvale, California company founded in 2015 that builds a
  consumer platform where users aged 8 and up can play, modify, remix, and share short 3D microgames
  and AI-powered interactive memes. Originally a computational-thinking and math learning tool under
  the Polyup brand, the product has evolved into a generative-AI-driven microgame and viral-content
  community at letsmod.com. Let'sMOD is a 500 Global portfolio company. It exposes no public developer
  API, SDK, or developer portal today; its public GitHub organization contains only internal CLI
  tooling and configuration. This profile was added to the API Evangelist network as a portfolio lead
  and enriched via live domain-security probing.
